<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 380" role="img" aria-labelledby="title desc"><title id="title">One dataset, three ways to ask</title><desc id="desc">Zarr is an array format. This lab materializes a small subset into SQLite; it is not a remote SQL engine.</desc><rect width="1080" height="380" rx="16" fill="#0b1c2b"/><g font-family="system-ui,sans-serif"><text x="30" y="47" fill="#67e8f9" font-size="27" font-weight="700">One dataset, three ways to ask</text><rect x="30" y="80" width="320" height="215" rx="14" fill="#153448" stroke="#316277"/><circle cx="68" cy="119" r="20" fill="#67e8f9"/><text x="68" y="126" fill="#08202b" font-size="21" text-anchor="middle" font-weight="700">1</text><text x="52" y="168" fill="#ffffff" font-size="22">Cube</text><text x="52" y="207" fill="#b9d5df" font-size="19">Time × latitude × longitude.</text><text x="52" y="234" fill="#b9d5df" font-size="19">Chunks organize the array</text><text x="52" y="261" fill="#b9d5df" font-size="19">for reading.</text><path d="M 357 190 h 15 m -6 -6 l 6 6 -6 6" fill="none" stroke="#67e8f9" stroke-width="3"/><rect x="380" y="80" width="320" height="215" rx="14" fill="#153448" stroke="#316277"/><circle cx="418" cy="119" r="20" fill="#67e8f9"/><text x="418" y="126" fill="#08202b" font-size="21" text-anchor="middle" font-weight="700">2</text><text x="402" y="168" fill="#ffffff" font-size="22">Table</text><text x="402" y="207" fill="#b9d5df" font-size="19">Materialize a bounded slice.</text><text x="402" y="234" fill="#b9d5df" font-size="19">SQL filters and aggregates</text><text x="402" y="261" fill="#b9d5df" font-size="19">explicit rows.</text><path d="M 707 190 h 15 m -6 -6 l 6 6 -6 6" fill="none" stroke="#67e8f9" stroke-width="3"/><rect x="730" y="80" width="320" height="215" rx="14" fill="#153448" stroke="#316277"/><circle cx="768" cy="119" r="20" fill="#67e8f9"/><text x="768" y="126" fill="#08202b" font-size="21" text-anchor="middle" font-weight="700">3</text><text x="752" y="168" fill="#ffffff" font-size="22">Linked views</text><text x="752" y="207" fill="#b9d5df" font-size="19">Map where, chart when, and</text><text x="752" y="234" fill="#b9d5df" font-size="19">inspect exact values before</text><text x="752" y="261" fill="#b9d5df" font-size="19">drawing conclusions.</text><text x="30" y="338" fill="#d6e5eb" font-size="17">Zarr is an array format. This lab materializes a small subset into SQLite; it is not a remote</text><text x="30" y="365" fill="#d6e5eb" font-size="17">SQL engine.</text></g></svg>