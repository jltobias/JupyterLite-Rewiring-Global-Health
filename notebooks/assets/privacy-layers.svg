<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 380" role="img" aria-labelledby="title desc"><title id="title">Protection happens before and after encryption</title><desc id="desc">Encryption protects a payload. It does not make the decrypted map anonymous or ethically appropriate.</desc><rect width="1080" height="380" rx="16" fill="#0b1c2b"/><g font-family="system-ui,sans-serif"><text x="30" y="47" fill="#67e8f9" font-size="27" font-weight="700">Protection happens before and after encryption</text><rect x="30" y="80" width="320" height="215" rx="14" fill="#153448" stroke="#316277"/><circle cx="68" cy="119" r="20" fill="#67e8f9"/><text x="68" y="126" fill="#08202b" font-size="21" text-anchor="middle" font-weight="700">1</text><text x="52" y="168" fill="#ffffff" font-size="22">Minimize</text><text x="52" y="207" fill="#b9d5df" font-size="19">Collect and keep only the</text><text x="52" y="234" fill="#b9d5df" font-size="19">precision and attributes the</text><text x="52" y="261" fill="#b9d5df" font-size="19">task requires.</text><path d="M 357 190 h 15 m -6 -6 l 6 6 -6 6" fill="none" stroke="#67e8f9" stroke-width="3"/><rect x="380" y="80" width="320" height="215" rx="14" fill="#153448" stroke="#316277"/><circle cx="418" cy="119" r="20" fill="#67e8f9"/><text x="418" y="126" fill="#08202b" font-size="21" text-anchor="middle" font-weight="700">2</text><text x="402" y="168" fill="#ffffff" font-size="22">Protect</text><text x="402" y="207" fill="#b9d5df" font-size="19">Use aggregation when</text><text x="402" y="234" fill="#b9d5df" font-size="19">appropriate. Encrypt with</text><text x="402" y="261" fill="#b9d5df" font-size="19">authenticated cryptography.</text><path d="M 707 190 h 15 m -6 -6 l 6 6 -6 6" fill="none" stroke="#67e8f9" stroke-width="3"/><rect x="730" y="80" width="320" height="215" rx="14" fill="#153448" stroke="#316277"/><circle cx="768" cy="119" r="20" fill="#67e8f9"/><text x="768" y="126" fill="#08202b" font-size="21" text-anchor="middle" font-weight="700">3</text><text x="752" y="168" fill="#ffffff" font-size="22">Review the release</text><text x="752" y="207" fill="#b9d5df" font-size="19">Keys, outputs, screenshots,</text><text x="752" y="234" fill="#b9d5df" font-size="19">and linked data all affect</text><text x="752" y="261" fill="#b9d5df" font-size="19">disclosure risk.</text><text x="30" y="338" fill="#d6e5eb" font-size="17">Encryption protects a payload. It does not make the decrypted map anonymous or ethically</text><text x="30" y="365" fill="#d6e5eb" font-size="17">appropriate.</text></g></svg>