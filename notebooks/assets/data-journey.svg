<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 380" role="img" aria-labelledby="title desc"><title id="title">A catalog is a doorway to evidence</title><desc id="desc">Keep satellite metadata, climate observations, projections, and synthetic teaching data distinct.</desc><rect width="1080" height="380" rx="16" fill="#0b1c2b"/><g font-family="system-ui,sans-serif"><text x="30" y="47" fill="#67e8f9" font-size="27" font-weight="700">A catalog is a doorway to evidence</text><rect x="30" y="80" width="320" height="215" rx="14" fill="#153448" stroke="#316277"/><circle cx="68" cy="119" r="20" fill="#67e8f9"/><text x="68" y="126" fill="#08202b" font-size="21" text-anchor="middle" font-weight="700">1</text><text x="52" y="168" fill="#ffffff" font-size="22">Discover</text><text x="52" y="207" fill="#b9d5df" font-size="19">STAC locates an asset. C3S</text><text x="52" y="234" fill="#b9d5df" font-size="19">provides product-specific</text><text x="52" y="261" fill="#b9d5df" font-size="19">climate information.</text><path d="M 357 190 h 15 m -6 -6 l 6 6 -6 6" fill="none" stroke="#67e8f9" stroke-width="3"/><rect x="380" y="80" width="320" height="215" rx="14" fill="#153448" stroke="#316277"/><circle cx="418" cy="119" r="20" fill="#67e8f9"/><text x="418" y="126" fill="#08202b" font-size="21" text-anchor="middle" font-weight="700">2</text><text x="402" y="168" fill="#ffffff" font-size="22">Inspect</text><text x="402" y="207" fill="#b9d5df" font-size="19">Check time, units,</text><text x="402" y="234" fill="#b9d5df" font-size="19">resolution, missing values,</text><text x="402" y="261" fill="#b9d5df" font-size="19">license, and provenance.</text><path d="M 707 190 h 15 m -6 -6 l 6 6 -6 6" fill="none" stroke="#67e8f9" stroke-width="3"/><rect x="730" y="80" width="320" height="215" rx="14" fill="#153448" stroke="#316277"/><circle cx="768" cy="119" r="20" fill="#67e8f9"/><text x="768" y="126" fill="#08202b" font-size="21" text-anchor="middle" font-weight="700">3</text><text x="752" y="168" fill="#ffffff" font-size="22">Interpret</text><text x="752" y="207" fill="#b9d5df" font-size="19">A geographic pattern is a</text><text x="752" y="234" fill="#b9d5df" font-size="19">question to investigate, not</text><text x="752" y="261" fill="#b9d5df" font-size="19">a causal explanation.</text><text x="30" y="338" fill="#d6e5eb" font-size="17">Keep satellite metadata, climate observations, projections, and synthetic teaching data</text><text x="30" y="365" fill="#d6e5eb" font-size="17">distinct.</text></g></svg>