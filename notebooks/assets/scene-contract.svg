<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 380" role="img" aria-labelledby="title desc"><title id="title">A rich scene still needs a clear contract</title><desc id="desc">Pair every 3D scene with an accessible 2D view and an inspectable data table.</desc><rect width="1080" height="380" rx="16" fill="#0b1c2b"/><g font-family="system-ui,sans-serif"><text x="30" y="47" fill="#67e8f9" font-size="27" font-weight="700">A rich scene still needs a clear contract</text><rect x="30" y="80" width="320" height="215" rx="14" fill="#153448" stroke="#316277"/><circle cx="68" cy="119" r="20" fill="#67e8f9"/><text x="68" y="126" fill="#08202b" font-size="21" text-anchor="middle" font-weight="700">1</text><text x="52" y="168" fill="#ffffff" font-size="22">Location</text><text x="52" y="207" fill="#b9d5df" font-size="19">Coordinates, CRS, scale, and</text><text x="52" y="234" fill="#b9d5df" font-size="19">geography define where the</text><text x="52" y="261" fill="#b9d5df" font-size="19">layer belongs.</text><path d="M 357 190 h 15 m -6 -6 l 6 6 -6 6" fill="none" stroke="#67e8f9" stroke-width="3"/><rect x="380" y="80" width="320" height="215" rx="14" fill="#153448" stroke="#316277"/><circle cx="418" cy="119" r="20" fill="#67e8f9"/><text x="418" y="126" fill="#08202b" font-size="21" text-anchor="middle" font-weight="700">2</text><text x="402" y="168" fill="#ffffff" font-size="22">Meaning</text><text x="402" y="207" fill="#b9d5df" font-size="19">Units and time explain what</text><text x="402" y="234" fill="#b9d5df" font-size="19">each color, column, and</text><text x="402" y="261" fill="#b9d5df" font-size="19">surface represents.</text><path d="M 707 190 h 15 m -6 -6 l 6 6 -6 6" fill="none" stroke="#67e8f9" stroke-width="3"/><rect x="730" y="80" width="320" height="215" rx="14" fill="#153448" stroke="#316277"/><circle cx="768" cy="119" r="20" fill="#67e8f9"/><text x="768" y="126" fill="#08202b" font-size="21" text-anchor="middle" font-weight="700">3</text><text x="752" y="168" fill="#ffffff" font-size="22">Responsibility</text><text x="752" y="207" fill="#b9d5df" font-size="19">Privacy, uncertainty, and</text><text x="752" y="234" fill="#b9d5df" font-size="19">audience determine what</text><text x="752" y="261" fill="#b9d5df" font-size="19">should be shown.</text><text x="30" y="338" fill="#d6e5eb" font-size="17">Pair every 3D scene with an accessible 2D view and an inspectable data table.</text></g></svg>