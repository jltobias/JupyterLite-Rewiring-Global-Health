<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 600" role="img" aria-labelledby="title desc"><title id="title">Six perspectives and a synthesis step</title><desc id="desc">White evidence, red experience, black caution, yellow benefit, green alternatives, and blue process contribute to a purple synthesis. Humans retain decision authority.</desc><rect width="1080" height="600" rx="16" fill="#0b1c2b"/><g font-family="system-ui,sans-serif"><text x="32" y="46" fill="#67e8f9" font-size="28" font-weight="700">See the whole question together</text><rect x="30" y="80" width="320" height="153" rx="14" fill="#153448" stroke="#e2e8f0"/><path d="M 52 117 h 46 m -37 0 v -15 h 27 v 15" stroke="#e2e8f0" fill="none" stroke-width="6"/><text x="52" y="152" fill="#e2e8f0" font-size="21">White / evidence</text><text x="52" y="183" fill="#d4e5eb" font-size="17">Separate measured data,</text><text x="52" y="205" fill="#d4e5eb" font-size="17">assumptions, and missing</text><text x="52" y="227" fill="#d4e5eb" font-size="17">denominators.</text><rect x="380" y="80" width="320" height="153" rx="14" fill="#153448" stroke="#fda4af"/><path d="M 402 117 h 46 m -37 0 v -15 h 27 v 15" stroke="#fda4af" fill="none" stroke-width="6"/><text x="402" y="152" fill="#fda4af" font-size="21">Red / experience</text><text x="402" y="183" fill="#d4e5eb" font-size="17">Invite community concerns; never</text><text x="402" y="205" fill="#d4e5eb" font-size="17">fabricate community testimony.</text><rect x="730" y="80" width="320" height="153" rx="14" fill="#153448" stroke="#94a3b8"/><path d="M 752 117 h 46 m -37 0 v -15 h 27 v 15" stroke="#94a3b8" fill="none" stroke-width="6"/><text x="752" y="152" fill="#94a3b8" font-size="21">Black / caution</text><text x="752" y="183" fill="#d4e5eb" font-size="17">Inspect disclosure, exclusion,</text><text x="752" y="205" fill="#d4e5eb" font-size="17">error, and false certainty.</text><rect x="30" y="255" width="320" height="153" rx="14" fill="#153448" stroke="#fde047"/><path d="M 52 292 h 46 m -37 0 v -15 h 27 v 15" stroke="#fde047" fill="none" stroke-width="6"/><text x="52" y="327" fill="#fde047" font-size="21">Yellow / benefit</text><text x="52" y="358" fill="#d4e5eb" font-size="17">Name a testable benefit and who</text><text x="52" y="380" fill="#d4e5eb" font-size="17">should receive it.</text><rect x="380" y="255" width="320" height="153" rx="14" fill="#153448" stroke="#86efac"/><path d="M 402 292 h 46 m -37 0 v -15 h 27 v 15" stroke="#86efac" fill="none" stroke-width="6"/><text x="402" y="327" fill="#86efac" font-size="21">Green / alternatives</text><text x="402" y="358" fill="#d4e5eb" font-size="17">Compare non-AI options and less</text><text x="402" y="380" fill="#d4e5eb" font-size="17">invasive ways to answer.</text><rect x="730" y="255" width="320" height="153" rx="14" fill="#153448" stroke="#7dd3fc"/><path d="M 752 292 h 46 m -37 0 v -15 h 27 v 15" stroke="#7dd3fc" fill="none" stroke-width="6"/><text x="752" y="327" fill="#7dd3fc" font-size="21">Blue / process</text><text x="752" y="358" fill="#d4e5eb" font-size="17">Assign human review, evaluation,</text><text x="752" y="380" fill="#d4e5eb" font-size="17">and a stopping rule.</text><path d="M 195 427 L 420 465 M 540 427 L 540 465 M 895 427 L 660 465" stroke="#c4a5f4" stroke-width="3"/><rect x="220" y="462" width="640" height="75" rx="16" fill="#503876"/><text x="540" y="493" text-anchor="middle" fill="white" font-size="24">Synthesize without erasing disagreement</text><text x="540" y="520" text-anchor="middle" fill="#e2d8f3" font-size="17">Human judgment, accountable ownership, explicit next steps</text><text x="30" y="573" fill="#b9d5df" font-size="16">Inspired by de Bono’s Six Thinking Hats. Purple synthesis is this project’s extension.</text></g></svg>