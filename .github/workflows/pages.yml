name: Build and deploy Jupyter Book + JupyterLite

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-labs.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify teaching models and execute all notebooks
        run: |
          python scripts/check_models.py
          python scripts/execute_notebooks.py

      - name: Build Jupyter Book
        env:
          BASE_URL: /${{ github.event.repository.name }}
        run: jupyter book build --html --strict

      - name: Stage demos and clean-output notebooks
        run: python scripts/prepare_site.py

      - name: Build JupyterLite inside the book
        run: jupyter lite build --contents _build/lite-contents --output-dir _build/html/lite

      - name: Disable Jekyll
        run: touch _build/html/.nojekyll

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
